name: PixaShop desktop builds
on:
  workflow_dispatch:
  push:
    branches: [pixashop-product]
    paths: [pixashop/**, .github/workflows/pixashop-build.yml]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    env:
      PYTHONUTF8: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      PHOTOCRAFT_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging dependency
        run: python -m pip install Pillow
      - name: Install Rust
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          shared-key: pixashop-desktop
      - name: Prepare PixaShop
        run: python pixashop/prepare.py
      - name: Check native application
        run: cargo check -p photocraft
      - name: Access regression tests
        run: cargo test -p photocraft access::tests --bin photocraft
      - name: Reclaim test-build disk space
        run: cargo clean --profile dev
      - name: Build desktop
        if: runner.os != 'macOS'
        run: cargo build --release -p photocraft
      - name: Build universal Mac desktop
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release -p photocraft --target aarch64-apple-darwin
          cargo build --release -p photocraft --target x86_64-apple-darwin
      - name: Package testing build
        run: python pixashop/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: PixaShop-${{ runner.os }}-testing
          path: |
            dist/pixashop/pixashop-*
          if-no-files-found: error
          retention-days: 14
# These are unsigned testing artifacts, not a production release. Publish a stable
# release only after signing, platform QA and production trial activation pass.
